name: Match reactions

# Live post-match reactions: polls during plausible WC match hours and reacts
# to any FINISHED match not yet reacted to (state in data/reacted_matches.json,
# committed back after each run). Stateful, so a skipped run, a late score or a
# knockout that ran to extra time / penalties is always caught on a later run —
# one reaction per match, never skipped, never duplicated.
on:
  schedule:
    # every 15 min during match hours (kickoffs ~16:00-04:00 UTC), offset off
    # the top of the hour. Free on the public repo, so we poll often for fresh
    # reactions; the state file dedupes regardless of how often it fires.
    - cron: "2,17,32,47 16-23 * * *"
    - cron: "2,17,32,47 0-7 * * *"
  workflow_dispatch:
    inputs:
      match_id:
        description: "Override: react to one specific finished fixture id."
        required: false
        type: string

jobs:
  reactions:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the reacted-match state back to main
    timeout-minutes: 20

    env:
      DATA_MODE: live
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run reaction poller
        run: |
          if [ -n "${{ inputs.match_id }}" ]; then
            python main.py --reaction "${{ inputs.match_id }}"
          else
            python main.py --reactions
          fi

      - name: Commit reaction state
        if: success()
        run: |
          if git diff --quiet -- data/reacted_matches.json; then
            echo "[state] no change to commit"
            exit 0
          fi
          git config user.name "worldcup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reacted_matches.json
          git commit -m "chore(reactions): advance reacted state [skip ci]"
          git push origin HEAD:main

      - name: Upload generated slides as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactions-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
